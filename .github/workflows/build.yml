name: Build IPA
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Find project
        run: |
          shopt -s nullglob
          ls -la
          if ! find . -name project.yml -not -path './.git/*' | grep -q .; then
            for z in *.zip; do echo "Unzipping $z"; unzip -q -o "$z"; done
          fi
          F=$(find . -name project.yml -not -path './.git/*' | head -1)
          if [ -z "$F" ]; then echo "::error::No project found. Upload Lumen-iOS12.zip to the repo."; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$F")" >> "$GITHUB_ENV"
      - name: Select Xcode 16
        run: |
          XC=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild -project Lumen.xcodeproj -scheme Lumen \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Lumen.app Payload/
          zip -qry Lumen.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-ipa
          path: ${{ env.PROJECT_DIR }}/Lumen.ipa
