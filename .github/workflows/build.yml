name: Build IPA

on:
  push:
    branches: [main]
    # Pushes that only change the README (or other Markdown docs) don't start a build.
    # A push that also changes app files still builds.
    paths-ignore:
      - "**.md"
  workflow_dispatch: # "Run workflow" button for building by hand


permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, used to count commits for the version number

      # Version = <VERSION file>.<commits since VERSION last changed>, e.g. 1.4.0, 1.4.1, …
      # Build number = this workflow's run number, which always goes up.
      - name: Compute version
        run: |
          BASE=$(tr -d '[:space:]' < VERSION)
          SINCE=$(git log -1 --format=%H -- VERSION)
          # Commits that never build ([skip ci], or only Markdown docs changed) don't use up a number.
          PATCH=$(git rev-list --count --invert-grep --grep='\[skip ci\]' "$SINCE"..HEAD -- . ':(exclude)*.md' ':(exclude)**/*.md')
          echo "APP_VERSION=$BASE.$PATCH" >> "$GITHUB_ENV"
          echo "APP_BUILD=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "Building Lumen $BASE.$PATCH (build ${{ github.run_number }})"

      # Xcode 16 still allows an iOS 12.0 deployment target.
      - name: Select Xcode 16
        run: |
          XC=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version

      - name: Install tools
        run: |
          brew install xcodegen
          which pod || sudo gem install cocoapods

      - name: Build (unsigned)
        run: |
          set -o pipefail
          {
            xcodegen generate &&
            pod install --repo-update &&
            xcodebuild \
              -workspace Lumen.xcworkspace \
              -scheme Lumen \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
              MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$APP_BUILD" \
              build
          } 2>&1 | tee build.log | grep -E "error:|\[!\]|\*\* BUILD"

      # Ad-hoc ("fake") signature with entitlements, so jailbroken devices with AppSync
      # (Filza, etc.) accept it. Sideloadly/AltStore replace this with a real signature.
      - name: Fakesign app
        run: |
          set -o pipefail
          APP=build/Build/Products/Release-iphoneos/Lumen.app
          {
            if [ -d "$APP/Frameworks" ]; then
              find "$APP/Frameworks" -maxdepth 1 \( -name "*.framework" -o -name "*.dylib" \) -print0 |
                while IFS= read -r -d '' f; do codesign -f -s - "$f"; done
            fi
            find "$APP" -name "*.appex" -print0 | while IFS= read -r -d '' f; do codesign -f -s - "$f"; done
            codesign -f -s - --entitlements Signing/fakesign.entitlements "$APP"
            codesign -d --entitlements - "$APP" 2>&1 | grep -q "application-identifier" ||
              { echo "error: fakesign: application-identifier entitlement missing"; exit 1; }
            codesign --verify --deep "$APP" || { echo "error: fakesign: signature verification failed"; exit 1; }
            echo "Fakesign OK"
          } 2>&1 | tee -a build.log

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Lumen.app Payload/
          zip -qry "Lumen-$APP_VERSION.ipa" Payload
          ls -lh "Lumen-$APP_VERSION.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-${{ env.APP_VERSION }}-ipa
          path: Lumen-${{ env.APP_VERSION }}.ipa

      # Saves a build report (errors, signing info, app contents) to the "build-log" branch
      # so it can be read without the Actions UI.
      - name: Publish build report
        if: always()
        run: |
          touch build.log
          APP=build/Build/Products/Release-iphoneos/Lumen.app
          grep -E "error:|\[!\]" build.log | sort -u | head -100 > errors.txt || true
          tail -n 200 build.log > tail.txt || true
          {
            echo "commit: ${GITHUB_SHA}"
            echo "version: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" 2>&1) (build $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist" 2>&1))"
            echo "--- entitlements"
            codesign -d --entitlements - "$APP" 2>&1 || true
            echo "--- signature"
            codesign -dv "$APP" 2>&1 || true
            echo "--- contents"
            ls -la "$APP" "$APP/Frameworks" 2>&1 || true
            echo "--- min OS"
            /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist" 2>&1 || true
          } > info.txt
          git config user.name "lumen-ci"
          git config user.email "lumen-ci@users.noreply.github.com"
          git checkout --orphan build-log
          git rm -rf --cached . > /dev/null
          git add -f errors.txt tail.txt info.txt
          git commit -m "Build report for ${GITHUB_SHA}"
          git push -f origin build-log
